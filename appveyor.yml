# AppVeyor CI - YGO-VI-EX
#
# 按「本机已验证可编译」的流程重写（2026-10-11）：
#   * 依赖只装构建真正需要的（jpeg/png/zlib 由 irrlicht 自带；lzma SDK 已随仓库在 gframe/lzma/）
#   * 构建脚本与资源用【仓库自带的】premake/ 与 resource/（xcopy 铺开）
#   * 产物是 x64 的 YGO-VI-EX.exe
#   * 全部使用相对路径与公开 URL，不依赖任何本机路径
version: '{build}'
skip_tags: true

image: Visual Studio 2019

environment:
  access_token:
    secure: QRJ97uSkoKE5kasZbXJMkRXX9VZYA4jUIl1YgkqMT+KE2hvSGds459bxYHQvvwFP

install:
  # 子模块（ocgcore）
  - git submodule update --init --recursive

  # ---------- premake5 ----------
  - curl --retry 5 --connect-timeout 30 -L -o premake-5.0.0-beta7-windows.zip https://github.com/premake/premake-core/releases/download/v5.0.0-beta7/premake-5.0.0-beta7-windows.zip
  - 7z x -y premake-5.0.0-beta7-windows.zip

  # ---------- libevent ----------
  - curl --retry 5 --connect-timeout 30 -L -o libevent-2.1.13-stable.tar.gz https://github.com/libevent/libevent/releases/download/release-2.1.13-stable/libevent-2.1.13-stable.tar.gz
  - tar xf libevent-2.1.13-stable.tar.gz
  - move libevent-2.1.13-stable event
  - xcopy /E /I /Y event\WIN32-Code event\include

  # ---------- freetype ----------
  - curl --retry 5 --connect-timeout 30 -L -o freetype.tar.gz https://github.com/freetype/freetype/archive/refs/tags/VER-2-14-3.tar.gz
  - tar xf freetype.tar.gz
  - move freetype-VER-2-14-3 freetype

  # ---------- lua ----------
  - curl --retry 5 --connect-timeout 30 -L -o lua-5.4.8.tar.gz https://www.lua.org/ftp/lua-5.4.8.tar.gz
  - tar xf lua-5.4.8.tar.gz
  - move lua-5.4.8 lua

  # ---------- sqlite3 ----------
  - curl --retry 5 --connect-timeout 30 -L -o sqlite-amalgamation-3530300.zip https://www.sqlite.org/2026/sqlite-amalgamation-3530300.zip
  - 7z x -y sqlite-amalgamation-3530300.zip
  - move sqlite-amalgamation-3530300 sqlite3

  # ---------- irrlicht（含内嵌 jpeglib/libpng/zlib/libwebp）----------
  - git clone --depth=1 --branch test https://github.com/mercury233/irrlicht
  - if not exist irrlicht\source\Irrlicht\libwebp git clone --depth=1 https://github.com/webmproject/libwebp irrlicht\source\Irrlicht\libwebp

  # ---------- miniaudio + 四个 xiph 解码库 ----------
  # 注意：旧 yml 里的 mercury233/miniaudio 已失效（克隆会要求账号 → exit 128）；改用官方源
  - curl --retry 5 --connect-timeout 30 -L -o miniaudio-master.zip https://github.com/mackron/miniaudio/archive/refs/heads/master.zip
  - 7z x -y miniaudio-master.zip
  - move miniaudio-master miniaudio

  - curl --retry 5 --connect-timeout 30 -L -o libogg-1.3.5.tar.gz https://github.com/xiph/ogg/releases/download/v1.3.5/libogg-1.3.5.tar.gz
  - tar xf libogg-1.3.5.tar.gz
  - move libogg-1.3.5 miniaudio\external\ogg

  - curl --retry 5 --connect-timeout 30 -L -o opus-1.5.2.tar.gz https://github.com/xiph/opus/releases/download/v1.5.2/opus-1.5.2.tar.gz
  - tar xf opus-1.5.2.tar.gz
  - move opus-1.5.2 miniaudio\external\opus

  - curl --retry 5 --connect-timeout 30 -L -o opusfile-0.12.tar.gz https://github.com/xiph/opusfile/releases/download/v0.12/opusfile-0.12.tar.gz
  - tar xf opusfile-0.12.tar.gz
  - move opusfile-0.12 miniaudio\external\opusfile

  - curl --retry 5 --connect-timeout 30 -L -o libvorbis-1.3.7.tar.gz https://github.com/xiph/vorbis/releases/download/v1.3.7/libvorbis-1.3.7.tar.gz
  - tar xf libvorbis-1.3.7.tar.gz
  - move libvorbis-1.3.7 miniaudio\external\vorbis

  # ---------- 用【仓库自带】的构建脚本与资源铺开（premake/ 与 resource/ 都在仓库里）----------
  - xcopy /E /I /Y premake\* .
  - xcopy /E /I /Y resource\* .

configuration: Release
platform: x64

before_build:
  # 生成 VS2019 工程（注意：不传 --winxp-support，本工程没这个选项）
  - premake5.exe vs2019

build_script:
  # msbuild 由 AppVeyor 的 VS2019 镜像提供（在 PATH 上），不要写死本机安装路径
  - msbuild build\YGOPro.sln /m /p:Configuration=Release /p:Platform=x64 /v:m /nodeReuse:false

after_build:
  - if exist bin\release\x64\YGO-VI-EX.exe copy /Y bin\release\x64\YGO-VI-EX.exe YGO-VI-EX.exe
  - dir bin\release\x64

test: off

artifacts:
  - path: YGO-VI-EX.exe
    name: YGO-VI-EX

cache:
  - premake-5.0.0-beta7-windows.zip
  - libevent-2.1.13-stable.tar.gz
  - freetype.tar.gz
  - lua-5.4.8.tar.gz
  - sqlite-amalgamation-3530300.zip
  - miniaudio-master.zip
  - libogg-1.3.5.tar.gz
  - opus-1.5.2.tar.gz
  - opusfile-0.12.tar.gz
  - libvorbis-1.3.7.tar.gz
